name: Build

# Builds a package for every platform VoxelCraft ships on and publishes them as one GitHub
# Release. The release is automatic: a build that succeeds always publishes, so there is no
# second, forgettable step.
#
#   git tag v1.0.3 && git push origin v1.0.3   -> release under the tag that was pushed
#   Actions tab -> Build -> Run workflow       -> release the next patch version
#   the same, with "publish" turned off        -> build only, as downloadable artifacts
#
# Godot is not vendored: every job downloads the 4.5.x engine build and the matching export
# templates, and both are cached, so only the first run pays for the ~1 GB download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release once every package has built"
        type: boolean
        default: true
      version:
        description: "Version to release, e.g. 1.0.3. Empty = the next patch after the highest v* tag."
        type: string
        default: ""

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5.1"

jobs:
  # Resolved once, up front: the packages are named after the version and the release is
  # published under it, so the one thing the build and the release have to agree on is which
  # version this run is.
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}   # 1.0.3 -- what the files are named after
      tag: ${{ steps.pick.outputs.tag }}           # v1.0.3 -- what the release is published under
    steps:
      - uses: actions/checkout@v4
        with:
          # the next version is derived from the tags, and a shallow checkout has none
          fetch-depth: 0
          fetch-tags: true

      - id: pick
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # a pushed tag names the release outright; otherwise the version typed into a
          # manual run; and failing both, the next patch after the highest version tag --
          # so that a build always has a version to publish under
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#refs/tags/}"
          elif [ -n "${REQUESTED:-}" ]; then
            # ${REQUESTED:-}: the input is empty on a tag push, and for a manual run that
            # leaves the version blank -- and `set -u` would abort on an unset name
            TAG="${REQUESTED:-}"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
            # refuse a version that is already taken rather than quietly attaching the
            # release to whatever old commit that tag happens to point at -- and refusing
            # here costs ten seconds, before any of the expensive builds have started
            if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "::error::$TAG already exists. Pick a free version, or push that tag onto the commit you want it on."
              exit 1
            fi
          else
            LAST=$(git tag --list 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -z "$LAST" ]; then
              MAJ=1; MIN=0; PAT=0
            else
              BASE="${LAST#v}"
              MAJ="${BASE%%.*}"
              REST="${BASE#*.}"
              MIN="${REST%%.*}"
              PAT="${REST#*.}"
              PAT=$((PAT + 1))
            fi
            # never reuse a version that is already taken, even one pointing at an old commit
            while git rev-parse -q --verify "refs/tags/v${MAJ}.${MIN}.${PAT}" > /dev/null; do
              PAT=$((PAT + 1))
            done
            TAG="v${MAJ}.${MIN}.${PAT}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "this run releases ${TAG}"

  export:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      # one platform breaking must not cancel the others: a release with four packages out
      # of five is still a useful release, and the failing job's log is what fixes the fifth
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, preset: "Windows Desktop", out_dir: build/windows,
              target: VoxelCraft.exe, pkg: zipdir, suffix: windows-x86_64, ext: zip,
              extra: "--accessibility disabled" }
          - { name: Linux, os: ubuntu-latest, preset: Linux, out_dir: build/linux,
              target: VoxelCraft.x86_64, pkg: zipdir, suffix: linux-x86_64, ext: zip, extra: "" }
          - { name: macOS, os: macos-latest, preset: macOS, out_dir: build/macos,
              target: VoxelCraft.zip, pkg: file, suffix: macos-universal, ext: zip, extra: "" }
          - { name: Web, os: ubuntu-latest, preset: Web, out_dir: build/web,
              target: index.html, pkg: zipdir, suffix: web, ext: zip, extra: "" }
          - { name: Android, os: ubuntu-latest, preset: Android, out_dir: build/android,
              target: VoxelCraft.apk, pkg: file, suffix: android-arm64, ext: apk, extra: "" }

    steps:
      - uses: actions/checkout@v4

      # The engine and the templates live outside the workspace (the templates have to, Godot
      # looks for them in a fixed place), so the cache holds the downloads rather than the
      # installed result -- re-materialising them is a local unzip.
      - name: Cache the engine download
        uses: actions/cache@v4
        with:
          path: ~/godot-ci
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install the engine and the export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          case "$RUNNER_OS" in
            Linux)   ENGINE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" ;;
            Windows) ENGINE="Godot_v${GODOT_VERSION}-stable_win64.exe.zip" ;;
            macOS)   ENGINE="Godot_v${GODOT_VERSION}-stable_macos.universal.zip" ;;
          esac
          mkdir -p "$HOME/godot-ci"
          [ -f "$HOME/godot-ci/engine.zip" ]    || curl -fsSL -o "$HOME/godot-ci/engine.zip" "$BASE/$ENGINE"
          [ -f "$HOME/godot-ci/templates.tpz" ] || curl -fsSL -o "$HOME/godot-ci/templates.tpz" "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          [ -d "$HOME/godot-ci/engine" ]        || unzip -q -o "$HOME/godot-ci/engine.zip" -d "$HOME/godot-ci/engine"
          case "$RUNNER_OS" in
            Linux)   TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ;;
            macOS)   TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable" ;;
            Windows) TPL="$HOME/AppData/Roaming/Godot/export_templates/${GODOT_VERSION}.stable" ;;
          esac
          if [ ! -d "$TPL" ]; then
            rm -rf "$HOME/godot-ci/tpl"
            mkdir -p "$HOME/godot-ci/tpl" "$TPL"
            unzip -q -o "$HOME/godot-ci/templates.tpz" -d "$HOME/godot-ci/tpl"
            mv "$HOME/godot-ci/tpl/templates/"* "$TPL/"
          fi

      - name: Locate the engine binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # the macOS download is an .app bundle, so the runnable binary sits inside it
            BIN=$(find "$HOME/godot-ci/engine" -type f -path '*/Contents/MacOS/*' | head -n1)
          else
            BIN=$(find "$HOME/godot-ci/engine" -maxdepth 1 -type f -name 'Godot_v*' ! -name '*.zip' | head -n1)
          fi
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      # ---- Android's toolchain, which no other platform needs: a JDK, the SDK, and a
      # keystore to sign the APK with. Godot reads the SDK and JDK from ANDROID_HOME and
      # JAVA_HOME when its editor settings are empty, and the keystore from the
      # GODOT_ANDROID_KEYSTORE_DEBUG_* variables -- so no settings file has to be written.
      - name: Set up the JDK (Android)
        if: matrix.name == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android SDK
        if: matrix.name == 'Android'
        id: cache_android
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/.android
          key: android-sdk-r35-v1

      - name: Install the Android SDK
        if: matrix.name == 'Android' && steps.cache_android.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$HOME/clt.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o "$HOME/clt.zip" -d "$SDK/cmdline-tools"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          export ANDROID_HOME="$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" \
            "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      # These have to be exported to the job, not just set inside the step above: Godot is
      # run by a later step, and it is Godot that reads them.
      - name: Export the Android environment
        if: matrix.name == 'Android'
        shell: bash
        run: |
          {
            echo "ANDROID_HOME=$HOME/android-sdk"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            # a *release* export signs with the release keystore, so the same key has to be
            # offered as both -- without this the release build refuses to sign at all
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.out_dir }}"
          # one import pass first: the export only sees resources the import step registered
          "$GODOT_BIN" --headless --path . ${{ matrix.extra }} --import --quit-after 60
          "$GODOT_BIN" --headless --path . ${{ matrix.extra }} \
            --export-release "${{ matrix.preset }}" "${{ matrix.out_dir }}/${{ matrix.target }}"
          ls -l "${{ matrix.out_dir }}"

      - name: Package (Windows)
        if: matrix.pkg == 'zipdir' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "${{ matrix.out_dir }}\*" `
            -DestinationPath "dist\VoxelCraft-${{ env.VERSION }}-${{ matrix.suffix }}.${{ matrix.ext }}" -Force
          Get-ChildItem dist

      # macOS already comes out zipped by the exporter and an APK is an archive in its own
      # right, so those two are copied as they are; the rest are wrapped so that a download
      # is a single file.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="VoxelCraft-${VERSION}-${{ matrix.suffix }}"
          case "${{ matrix.pkg }}" in
            zipdir) ( cd "${{ matrix.out_dir }}" && zip -qr "$GITHUB_WORKSPACE/dist/$OUT.zip" . ) ;;
            file)   cp "${{ matrix.out_dir }}/${{ matrix.target }}" "dist/$OUT.${{ matrix.ext }}" ;;
          esac
          ls -l dist

      # ---- the Windows installer, on top of the portable build
      - name: Package the Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ env.VERSION }}" `
                  "/DPayloadDir=$PWD\${{ matrix.out_dir }}" `
                  "/DIconFile=$PWD\assets\icon\voxelcraft_deep.ico" `
                  "/DDistDir=$PWD\dist" `
                  "tools\voxelcraft.iss"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, export]
    # every build that succeeds publishes, so a release is never a second step to remember:
    # a pushed tag names it, and a run with no tag takes the next version. The one way out is
    # turning "publish" off on a manual run, which is how a build is checked without cutting
    # a version at all.
    if: |
      needs.export.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # --target pins the tag to the commit that was built, rather than letting gh
            # tag whatever the default branch happens to point at by the time this runs
            gh release create "$TAG" dist/* \
              --title "VoxelCraft $VERSION" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
